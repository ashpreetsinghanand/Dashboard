# Local stack: PostgreSQL + the KRSI backend (API on http://127.0.0.1:8080, Swagger at /swagger-ui.html).
# Run the UI separately with `npm run dev`; Vite proxies /api to the backend.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: krsi
      POSTGRES_USER: krsi
      POSTGRES_PASSWORD: local_dev_only
    volumes:
      - krsi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krsi -d krsi"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      # the app binds to 127.0.0.1 by default, which is unreachable from outside the container
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: db
      DB_NAME: krsi
      DB_USER: krsi
      DB_PASSWORD: local_dev_only
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      # KYC: mock by default; KYC_PROVIDER=setu plus the SETU_* keys from your shell to try real Setu DigiLocker
      KYC_PROVIDER: ${KYC_PROVIDER:-mock}
      # blank: OTPs are only shown on screen (local dev); set it in your shell to send real SMS
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
      SETU_CLIENT_ID: ${SETU_CLIENT_ID:-}
      SETU_CLIENT_SECRET: ${SETU_CLIENT_SECRET:-}
      SETU_PRODUCT_INSTANCE_ID: ${SETU_PRODUCT_INSTANCE_ID:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  krsi-db:
