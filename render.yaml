# Render Blueprint: Postgres + the Spring Boot API (Docker). Dashboard → New → Blueprint → this repo.
databases:
  - name: krsi-db
    plan: free
    databaseName: krsi
    user: krsi

services:
  - type: web
    name: krsi-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: SERVER_PORT
        value: "10000"
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75
      - key: DB_HOST
        fromDatabase: { name: krsi-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: krsi-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: krsi-db, property: database }
      - key: DB_USER
        fromDatabase: { name: krsi-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: krsi-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: LEDGER_CHAIN_ID
        value: krsi-ledger-render
      # Public URL: never return OTPs in API responses (that would let anyone reset any password). Codes go to the service logs.
      - key: OTP_EXPOSE_IN_RESPONSE
        value: "false"
      # The frontend's origin(s), comma-separated, e.g. https://krsi-dashboard.vercel.app; asked for on first deploy.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
