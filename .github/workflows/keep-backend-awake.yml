# Render's free plan sleeps the API after 15 idle minutes (the next request then takes ~1 min).
# Ping it every 10 minutes so the dashboard stays fast. Uses ~744 of Render's 750 free instance-hours a month,
# so keep only one free web service awake. GitHub can delay scheduled runs at busy times.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health check
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 https://krsi-backend-dqd5.onrender.com/api/health
